name: Build and Package LaptopManager

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6 (Windows MSVC)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable
        run: |
          cmake --build build --config Release

      - name: Run windeployqt
        shell: bash
        run: |
          mkdir -p dist
          if [ -f "build/Release/laptop_manager.exe" ]; then
            cp build/Release/laptop_manager.exe dist/
          else
            cp build/laptop_manager.exe dist/
          fi
          windeployqt --release --compiler-runtime dist/laptop_manager.exe

      - name: Create Windows ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath LaptopManager-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopManager-Windows-x64
          path: LaptopManager-Windows-x64.zip

  build-linux:
    name: Linux x64 Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake qt6-base-dev libqt6sql6-sqlite

      - name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

      - name: Build Executable & Run Tests
        run: |
          cmake --build build --config Release
          LAPTOPS_DATA_DIR=./test_db ./build/test_manager

      - name: Package Linux Binary
        run: |
          mkdir -p dist-linux
          cp build/laptop_manager dist-linux/
          tar -czvf LaptopManager-Linux-x64.tar.gz -C dist-linux .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopManager-Linux-x64
          path: LaptopManager-Linux-x64.tar.gz

  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: LaptopManager-Windows-x64
          path: ./dist-release

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: LaptopManager-Linux-x64
          path: ./dist-release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-release/LaptopManager-Windows-x64.zip
            dist-release/LaptopManager-Linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
