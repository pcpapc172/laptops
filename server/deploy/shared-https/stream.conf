# Include at nginx MAIN scope (outside http {}) when Xray shares public 443.
# Xray's former 443 inbound must listen on 127.0.0.1:19443 instead.
stream {
    map $ssl_preread_server_name $laptops_upstream {
        laptops.pcpapc172.ir 127.0.0.1:18443;
        laptops-cf.pcpapc172.ir 127.0.0.1:18443;
        default 127.0.0.1:19443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $laptops_upstream;
        proxy_connect_timeout 5s;
        proxy_timeout 1h;
    }
}
