server {
    listen 80;
    listen [::]:80;
    server_name laptops.pcpapc172.ir laptops-cf.pcpapc172.ir;
    root /var/www/laptops-acme;
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:18443 ssl;
    server_name laptops.pcpapc172.ir laptops-cf.pcpapc172.ir;
    ssl_certificate /etc/letsencrypt/live/laptops.pcpapc172.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/laptops.pcpapc172.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    access_log off;
    location = /downloads { return 301 /downloads/; }
    location ^~ /downloads/ {
        alias /var/www/laptops-downloads/;
        index index.html;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "public, max-age=3600";
    }
    location / {
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
