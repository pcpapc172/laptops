# Port 80 remains available for the existing standalone ACME renewal.
server {
    listen 443 ssl;
    server_name 13.42.221.242;
    ssl_certificate /root/cert/ip/fullchain.pem;
    ssl_certificate_key /root/cert/ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LaptopsTLS:5m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 2m;
    client_body_timeout 15s;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
        proxy_send_timeout 20s;
    }
}
